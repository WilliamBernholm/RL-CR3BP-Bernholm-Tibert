# MASTER RUN QUEUE -- the manifest of record.
# Regenerate with `make queue`. Do not hand-edit.
version: 1
seeds:
- 1000
- 0
- 1
n_runs: 63
n_sensitivity: 12
notes:
  dedupe: 'The ablation ''Full method'' arm is NOT a separate run: --mode baseline is the headline TLI-3
    / MCC-2 curriculum. Table 4''s Full-method row is sourced from the headline runs.'
  sweep: Every tausweep_* row is a no_tau run at a constant drift. The sweep is the no-tau arm, not an
    independent experiment.
  noise: 'The *-noise rows are the only runs with dispersion on: a single per-episode Gaussian perturbation
    of the initial state, 1-sigma 33.33 km / 0.333 m/s at full ramp, one order of magnitude below LaFarge
    et al. 2021. Execution noise is excluded.'
  sensitivity: Frozen-policy dispersion sweeps, not training runs. Clean-trained and noise-trained, so
    the four cells of trained-clean/noise x evaluated-nominal/dispersed are all populated. Requires `make
    pack` first.
